[package]
name = "loom-scanner"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
