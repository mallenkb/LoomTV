<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>LoomTV</title>
  <style>
    :root{color-scheme:dark;--bg:#090909;--panel:#151515;--line:#2b2b2b;--text:#f7f7f7;--muted:#a3a3a3;--accent:#fc9c03;--ok:#64d99b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#202020;color:var(--text);padding:10px 14px}button.primary{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}input,select{width:100%;border:1px solid var(--line);border-radius:9px;background:#0d0d0d;color:var(--text);padding:11px 12px}label{display:grid;gap:6px;color:var(--muted);font-size:13px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px max(20px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(9,9,9,.9);backdrop-filter:blur(14px);z-index:2}.brand{font-size:23px;font-weight:800;letter-spacing:-.04em}.brand b{color:var(--accent)}main{max-width:1180px;margin:0 auto;padding:32px 20px 64px}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.12em}h1{margin:4px 0 8px;font-size:clamp(32px,5vw,56px);letter-spacing:-.06em;line-height:1}h2{margin:0 0 14px;font-size:22px}.muted{color:var(--muted)}.status{min-height:24px;margin:12px 0;color:var(--muted)}.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:20px;box-shadow:0 12px 35px #0004}.auth{max-width:460px;margin:8vh auto}.form{display:grid;gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.shell{display:grid;grid-template-columns:260px 1fr;gap:22px}.side{display:grid;gap:16px;align-content:start;position:sticky;top:92px;height:max-content}.side .card{padding:16px}.profile-list{display:grid;gap:8px}.profile-list button{text-align:left}.profile-list button.active{border-color:var(--accent);color:var(--accent)}.library{display:grid;gap:20px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.media{overflow:hidden;padding:0}.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#292929,#0b0b0b);display:grid;place-items:center;color:#777;font-size:38px}.media-body{padding:14px}.media-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-meta{color:var(--muted);font-size:13px;margin:3px 0 12px}.media-actions{display:flex;gap:8px}.media-actions button{padding:8px 10px;font-size:13px}.player{display:grid;gap:12px}.player video{width:100%;max-height:68vh;background:#000;border-radius:12px}.progress{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.progress input{max-width:120px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:static;grid-template-columns:1fr 1fr}.side .card:last-child{grid-column:1/-1}}@media(max-width:520px){.side{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="authView" class="auth card">
    <div class="eyebrow">LoomTV hosted client</div><h1 id="authTitle">Sign in</h1>
    <p id="authCopy" class="muted">Connect to your always-on LoomTV server.</p>
    <form id="authForm" class="form">
      <label id="nameField" class="hidden">Owner name<input id="name" autocomplete="name"></label>
      <label>Username<input id="username" autocomplete="username"></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8"></label>
      <button class="primary" id="authSubmit">Sign in</button>
    </form><div id="authStatus" class="status"></div>
  </div>
  <div id="appView" class="hidden">
    <header><div class="brand"><b>L</b> loomtv</div><div class="actions"><span id="userName" class="muted"></span><button id="logout">Sign out</button></div></header>
    <main><div class="shell"><aside class="side">
      <section class="card"><div class="eyebrow">Profiles</div><h2>Who is watching?</h2><div id="profiles" class="profile-list"></div><form id="profileForm" class="form"><label>New profile<input id="profileName" placeholder="Name" maxlength="80" required></label><button class="primary">Add profile</button></form></section>
      <section class="card"><div class="eyebrow">Server</div><div id="serverStatus" class="muted">Loading…</div><button id="scan" class="hidden">Scan library</button></section>
    </aside><section class="library">
      <div class="toolbar"><div><div class="eyebrow">Your library</div><h1>Watch something.</h1><div id="libraryStatus" class="muted"></div></div></div>
      <section id="player" class="card player hidden"><video id="video" controls playsinline></video><div class="actions"><strong id="nowPlaying"></strong><button id="closePlayer">Close</button></div></section>
      <section id="mediaGrid" class="grid"></section>
    </section></div></main>
  </div>
  <script src="/app/hls.min.js"></script>
  <script>
    (() => {
      const tokenKey='loomtv.api.token'; let token=localStorage.getItem(tokenKey)||''; let selectedProfile=''; let currentMedia=''; let transcodeSession=''; let hlsInstance=null;
      const $=id=>document.getElementById(id); const authView=$('authView'),appView=$('appView');
      const setStatus=(id,text)=>$(id).textContent=text||'';
      async function api(path,options={}){const headers={Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})};const response=await fetch(path,{...options,headers});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error?.message||data.error||response.statusText);return data?.ok===true&&Object.prototype.hasOwnProperty.call(data,'data')?data.data:data;}
      function showAuth(onboarding){authView.classList.remove('hidden');appView.classList.add('hidden');$('authTitle').textContent=onboarding?'Create your LoomTV owner':'Sign in';$('authCopy').textContent=onboarding?'Set the first server password, then start watching.':'Connect to your always-on LoomTV server.';$('nameField').classList.toggle('hidden',!onboarding);$('username').classList.toggle('hidden',onboarding);$('authSubmit').textContent=onboarding?'Create owner':'Sign in';$('authForm').dataset.onboarding=onboarding?'1':'';}
      function showApp(){authView.classList.add('hidden');appView.classList.remove('hidden');}
      async function boot(){try{const d=await api('/api/v1/discovery');setStatus('serverStatus',(d.health?.media?.state||'server')+' · API v'+d.apiVersion);const onboard=await api('/api/v1/auth/onboarding');if(!token){showAuth(!onboard.ownerConfigured);return;}await loadApp();}catch(error){setStatus('authStatus',error.message);showAuth(false);}}
      async function loadApp(){const me=await api('/api/v1/auth/me');$('userName').textContent=me.user?.name||'Signed in';showApp();await Promise.all([loadProfiles(),loadLibrary()]);}
      async function loadProfiles(){const data=await api('/api/v1/profiles');const list=data.profiles||[];if(!selectedProfile)selectedProfile=list[0]?.id||'';$('profiles').innerHTML=list.length?list.map(p=>'<button data-profile="'+p.id+'" class="'+(p.id===selectedProfile?'active':'')+'">'+escapeHtml(p.name)+' <span class="muted">'+escapeHtml(p.type)+'</span></button>').join(''):'<div class="muted">Create a profile to save progress.</div>';document.querySelectorAll('[data-profile]').forEach(button=>button.onclick=async()=>{selectedProfile=button.dataset.profile;await api('/api/v1/profiles/'+encodeURIComponent(selectedProfile)+'/select',{method:'POST'});await loadProfiles();});}
      async function loadLibrary(){const data=await api('/api/v1/library');const items=data.items||[];setStatus('libraryStatus',items.length+' item'+(items.length===1?'':'s'));$('mediaGrid').innerHTML=items.length?items.map(item=>'<article class="card media"><div class="poster">'+(item.type==='tv'?'▤':'▶')+'</div><div class="media-body"><div class="media-title" title="'+escapeAttr(item.title)+'">'+escapeHtml(item.title)+'</div><div class="media-meta">'+escapeHtml(item.extension||item.type||'media')+(item.available===false?' · offline':'')+'</div><div class="media-actions"><button data-play="'+item.id+'" '+(item.available===false?'disabled':'')+'>Play</button><button data-progress="'+item.id+'">Progress</button></div></div></article>').join(''):'<div class="empty">No media indexed yet. Add a library root in the admin console, then scan.</div>';document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));document.querySelectorAll('[data-progress]').forEach(b=>b.onclick=()=>editProgress(b.dataset.progress));}
      function attachSource(url){if(hlsInstance){hlsInstance.destroy();hlsInstance=null;}const video=$('video');if(url.includes('.m3u8')&&window.Hls&&window.Hls.isSupported()){hlsInstance=new window.Hls({enableWorker:true});hlsInstance.loadSource(url);hlsInstance.attachMedia(video);}else if(url.includes('.m3u8')&&video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;}else if(url.includes('.m3u8')){throw new Error('This browser cannot play HLS and the bundled playback runtime is unavailable.');}else video.src=url;}
      async function play(id){try{const data=await api('/api/v1/media/'+encodeURIComponent(id));const directUrl=data.directUrl;let url=directUrl;const probe=await fetch(directUrl,{method:'HEAD'});if(!probe.ok){const transcode=await api(data.transcodeUrl+'?codec=h264',{method:'POST'});const payload=transcode.data||transcode;url=payload.playlistUrl;if(!url)throw new Error('The server could not start browser playback.');transcodeSession=payload.sessionId||'';}currentMedia=id;const saved=selectedProfile?await api('/api/v1/profiles/'+encodeURIComponent(selectedProfile)+'/progress/'+encodeURIComponent(id)).catch(()=>null):null;$('nowPlaying').textContent=data.item.title;$('player').classList.remove('hidden');attachSource(url);$('video').onloadedmetadata=()=>{if(saved?.progress?.position>5&&saved.progress.position<($('video').duration||Infinity)-5)$('video').currentTime=saved.progress.position;};$('video').play().catch(()=>{});$('video').onpause=saveCurrentProgress;}catch(error){setStatus('libraryStatus',error.message);}}
      async function saveCurrentProgress(){if(!selectedProfile||!currentMedia)return;const video=$('video');await api('/api/v1/profiles/'+encodeURIComponent(selectedProfile)+'/progress/'+encodeURIComponent(currentMedia),{method:'PUT',body:JSON.stringify({position:video.currentTime,duration:video.duration||0})}).catch(()=>{});}
      async function editProgress(id){if(!selectedProfile){setStatus('libraryStatus','Choose a profile first.');return;}const d=await api('/api/v1/profiles/'+encodeURIComponent(selectedProfile)+'/progress/'+encodeURIComponent(id));const value=d.progress?.position||0;const next=prompt('Resume position in seconds',String(Math.round(value)));if(next===null)return;await api('/api/v1/profiles/'+encodeURIComponent(selectedProfile)+'/progress/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({position:Number(next),duration:d.progress?.duration||0})});setStatus('libraryStatus','Progress saved.');}
      $('authForm').onsubmit=async event=>{event.preventDefault();const onboarding=event.currentTarget.dataset.onboarding==='1';setStatus('authStatus','Working…');try{const data=await api(onboarding?'/api/v1/auth/owner':'/api/v1/auth/session',{method:'POST',body:JSON.stringify({name:$('name').value,username:$('username').value,password:$('password').value})});token=data.adminToken||data.accessToken||'';if(!token)throw new Error('The server did not return a session token.');localStorage.setItem(tokenKey,token);await loadApp();}catch(error){setStatus('authStatus',error.message);}};
      $('profileForm').onsubmit=async event=>{event.preventDefault();try{await api('/api/v1/profiles',{method:'POST',body:JSON.stringify({name:$('profileName').value,type:'standard'})});$('profileName').value='';await loadProfiles();}catch(error){setStatus('libraryStatus',error.message);}};
      $('scan').onclick=async()=>{try{await api('/api/v1/library/scan',{method:'POST',body:'{}'});setStatus('libraryStatus','Scan started.');setTimeout(loadLibrary,1200);}catch(error){setStatus('libraryStatus',error.message);}};
      $('logout').onclick=async()=>{await api('/api/v1/auth/session',{method:'DELETE'}).catch(()=>{});token='';localStorage.removeItem(tokenKey);showAuth(false);};$('closePlayer').onclick=async()=>{$('video').pause();await saveCurrentProgress();if(transcodeSession)await fetch('/api/media/transcode/'+encodeURIComponent(transcodeSession),{method:'DELETE',headers:{Authorization:'Bearer '+token}}).catch(()=>{});transcodeSession='';if(hlsInstance){hlsInstance.destroy();hlsInstance=null;}$('video').removeAttribute('src');$('player').classList.add('hidden');};
      function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function escapeAttr(value){return escapeHtml(value);}
      boot();
    })();
  </script>
</body>
</html>
