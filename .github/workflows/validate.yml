name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Enforce workflow trust policy
        run: corepack pnpm verify:workflow-policy

      - name: Test workflow trust policy
        run: corepack pnpm test:workflow-policy

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

  supply-chain:
    name: Audit dependencies and generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: corepack pnpm run audit:prod

      - name: Generate deterministic dependency SBOM
        run: corepack pnpm run sbom

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: loomtv-dependency-sbom-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/loomtv-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  mobile-android-config:
    name: Verify generated Android configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate tracked Android build policy
        run: corepack pnpm mobile:verify-android-config

      - name: Validate mobile release configuration
        run: corepack pnpm mobile:verify-release-config

      - name: Regenerate Android project from tracked Expo configuration
        run: corepack pnpm --filter @loom-media-server/mobile exec expo prebuild --clean --platform android --no-install

      - name: Validate generated Android project
        run: corepack pnpm mobile:verify-android-config -- --require-generated

  unsigned-package:
    name: Unsigned package smoke (${{ matrix.platform }})
    needs:
      - code
      - supply-chain
      - mobile-android-config
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-26
            artifact: loomtv-unsigned-macos
          - platform: Windows
            os: windows-latest
            artifact: loomtv-unsigned-windows
          - platform: Linux
            os: ubuntu-latest
            artifact: loomtv-unsigned-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build unsigned installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          node apps/desktop/scripts/fetch-fpcalc.cjs
          corepack pnpm --filter loom-media-server-desktop run dist

      - name: Verify packaged runtime dependencies
        run: corepack pnpm --filter loom-media-server-desktop run verify:runtime

      - name: Upload unsigned package smoke artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/desktop/out/builder/**/*.dmg
            apps/desktop/out/builder/**/*.zip
            apps/desktop/out/builder/**/*.exe
            apps/desktop/out/builder/**/*.deb
            apps/desktop/out/builder/**/*.rpm
            apps/desktop/out/builder/**/*.AppImage
            apps/desktop/out/builder/**/*.blockmap
            apps/desktop/out/builder/**/*.yml
            apps/desktop/out/builder/**/*.yaml
          if-no-files-found: error
          retention-days: 7
