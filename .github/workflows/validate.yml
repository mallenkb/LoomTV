name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  # Validate the latest commit instead of making it wait for an older run.
  cancel-in-progress: true

jobs:
  code:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Enforce workflow trust policy
        run: corepack pnpm verify:workflow-policy

      - name: Test workflow trust policy
        run: corepack pnpm test:workflow-policy

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

  rust:
    name: Test and audit Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          with open("rust-toolchain.toml", "rb") as file:
              toolchain = tomllib.load(file)["toolchain"]
          command = ["rustup", "toolchain", "install", toolchain["channel"], "--profile", toolchain.get("profile", "minimal")]
          for component in toolchain.get("components", []):
              command.extend(["--component", component])
          for target in toolchain.get("targets", []):
              command.extend(["--target", target])
          subprocess.run(command, check=True)
          PY

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/native/scanner -> target

      - name: Install Linux Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev libgtk-3-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Test core crate
        working-directory: crates/loomtv-core
        run: cargo test --locked -p loomtv-core

      - name: Test playback crate
        working-directory: crates/loomtv-playback
        run: cargo test --locked -p loomtv-playback

      - name: Test Tauri host crate
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo test --locked -p loomtv-desktop-tauri

      - name: Test scanner workspace
        working-directory: apps/desktop/native/scanner
        run: cargo test --locked -p loom-scanner

      - name: Install Cargo audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit both Rust workspaces
        shell: bash
        run: |
          audit_status=0
          cargo audit --file Cargo.lock || audit_status=1
          cargo audit --file apps/desktop/native/scanner/Cargo.lock || audit_status=1
          exit "$audit_status"

  container:
    name: Build and smoke test headless container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build headless image
        run: docker build --file deploy/docker/Dockerfile --tag loomtv-ci .

      - name: Verify container health and non-root runtime
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs loomtv-ci; docker rm --force loomtv-ci' EXIT
          docker run --detach --name loomtv-ci --cap-drop ALL --security-opt no-new-privileges:true --env HOST=127.0.0.1 --health-interval 2s --health-start-period 2s --health-retries 10 loomtv-ci
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' loomtv-ci)
            if [ "$status" = healthy ]; then
              test "$(docker exec loomtv-ci id -u)" != 0
              test "$(docker exec loomtv-ci id -g)" != 0
              exit 0
            fi
            if [ "$status" = unhealthy ] || [ "$(docker inspect --format '{{.State.Running}}' loomtv-ci)" != true ]; then
              exit 1
            fi
            sleep 2
          done
          exit 1

  supply-chain:
    name: Audit dependencies and generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: corepack pnpm run audit:prod

      - name: Generate deterministic dependency SBOM
        run: corepack pnpm run sbom

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: loomtv-dependency-sbom-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/loomtv-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  unsigned-package:
    name: Unsigned package smoke (${{ matrix.platform }})
    # Native mobile builds run separately in mobile-native.yml.
    needs:
      - code
      - supply-chain
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-26
            artifact: loomtv-unsigned-macos
          - platform: Windows
            os: windows-latest
            artifact: loomtv-unsigned-windows
          - platform: Linux
            os: ubuntu-latest
            artifact: loomtv-unsigned-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build unsigned installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/fetch-fpcalc.cjs
          for attempt in 1 2 3; do
            echo "Building unsigned installers (attempt ${attempt}/3)"
            if corepack pnpm --filter loom-media-server-desktop run dist
            then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "Unsigned installer build failed; retrying to tolerate transient dependency or binary download failures."
            fi
          done
          exit 1

      - name: Verify packaged runtime dependencies
        run: corepack pnpm --filter loom-media-server-desktop run verify:runtime

      - name: Upload unsigned package smoke artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/desktop/out/builder/**/*.dmg
            apps/desktop/out/builder/**/*.zip
            apps/desktop/out/builder/**/*.exe
            apps/desktop/out/builder/**/*.deb
            apps/desktop/out/builder/**/*.rpm
            apps/desktop/out/builder/**/*.AppImage
            apps/desktop/out/builder/**/*.blockmap
            apps/desktop/out/builder/**/*.yml
            apps/desktop/out/builder/**/*.yaml
          if-no-files-found: error
          retention-days: 7
