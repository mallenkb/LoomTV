name: Prepare isolated Tauri development tools
on:
  push:
    branches: [codex/tauri-react-port]
    paths: ['.github/workflows/tauri-offline-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Resolve only the committed Linux dependency graph
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          sudo apt-get update -qq
          sudo apt-get install -y libdbus-1-dev pkg-config mpv > /tmp/tauri-apt.log 2>&1
      - name: Archive public toolchain and dependencies without runner credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence native/include native/lib native/bin
          rustc --version --verbose > evidence/rustc.txt
          git rev-parse HEAD > evidence/source-sha.txt
          sysroot="$(rustc --print sysroot)"
          tar --exclude=share/doc --exclude=share/man -C "$sysroot" -czf evidence/rust-toolchain.tar.gz .
          tar -C "${CARGO_HOME:-$HOME/.cargo}/registry" -czf evidence/cargo-registry.tar.gz cache index
          cp -a /usr/include/dbus-1.0 native/include/
          cp -a /usr/lib/x86_64-linux-gnu/dbus-1.0/include native/lib/dbus-include
          cp -L /usr/lib/x86_64-linux-gnu/libdbus-1.so native/lib/
          cp /usr/bin/mpv native/bin/
          python3 - <<'PY'
          import pathlib, re, shutil, subprocess
          deps = subprocess.check_output(['ldd', '/usr/bin/mpv'], text=True)
          for line in deps.splitlines():
              match = re.search(r'=> (/\S+)', line)
              if match:
                  source = pathlib.Path(match.group(1))
                  if source.name.startswith(('libc.so','libm.so','libpthread.so','libdl.so','librt.so')):
                      continue
                  shutil.copyfile(source, pathlib.Path('native/lib') / source.name)
          pathlib.Path('evidence/mpv-ldd.txt').write_text(deps)
          PY
          tar -czf evidence/native-build-tools.tar.gz native
          sha256sum evidence/*.tar.gz > evidence/archives.sha256
          du -h evidence/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tauri-offline-tools-${{ github.sha }}
          path: evidence/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
