name: Apply and verify memory branch

on:
  push:
    branches: [codex/reduce-memory-keep-vlc-warm]
    paths: [.github/workflows/apply-memory-branch.yml]

permissions:
  contents: read

concurrency:
  group: memory-branch-implementation
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'mallenkb/LoomTV' && github.ref == 'refs/heads/codex/reduce-memory-keep-vlc-warm'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out the exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply scoped source edits
        id: apply
        run: python3 scripts/apply-memory-branch.py
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install typecheck and test dependencies without native install scripts
        id: install
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Desktop typecheck
        id: typecheck
        continue-on-error: true
        run: corepack pnpm --filter loom-media-server-desktop typecheck
      - name: Memory and playback regression tests
        id: tests
        continue-on-error: true
        working-directory: apps/desktop
        run: node --experimental-strip-types --test tests/boundedMemoryCache.test.ts tests/lazyNativeMemory.test.ts tests/nativePlaybackLifecycle.test.ts tests/libvlcSessionState.test.ts tests/videoPlayerHelpers.test.ts
      - name: Lint changed code
        id: lint
        continue-on-error: true
        working-directory: apps/desktop
        run: corepack pnpm exec eslint src/main/boundedMemoryCache.ts src/main/libvlcNativeTypes.ts src/main/memoryMetrics.ts src/main/libvlcWarmup.ts src/main/libvlcPlayback.ts src/main/libmpvPlayback.ts src/main.ts src/App.tsx src/contexts/LibraryContext.tsx src/components/VideoPlayer.tsx src/components/VideoPlayer/LazyVideoPlayer.tsx src/shared/desktopProtocol.ts tests/boundedMemoryCache.test.ts tests/lazyNativeMemory.test.ts tests/lazyNativeMemory.cases.cjs
      - name: Build desktop bundles
        id: build
        continue-on-error: true
        run: corepack pnpm --filter loom-media-server-desktop build
      - name: Record checks and commit only to the requested branch
        if: always() && steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > apps/desktop/docs/scanner-benchmarks/memory-preserve-vlc-checks.txt <<'CHECKS'
          Automated verification of the memory branch
          Dependency install: ${{ steps.install.outcome }}
          Desktop typecheck: ${{ steps.typecheck.outcome }}
          Focused regression tests: ${{ steps.tests.outcome }}
          Changed-code lint: ${{ steps.lint.outcome }}
          Desktop bundle build: ${{ steps.build.outcome }}
          Native macOS playback and memory measurements: not run
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKS
          git diff --check
          git config user.name 'LoomTV coding agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src apps/desktop/tests apps/desktop/docs/scanner-benchmarks scripts/apply-memory-branch.py
          git commit -m 'Reduce idle memory while preserving LibVLC startup warmup'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          CURRENT=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" ls-remote origin refs/heads/codex/reduce-memory-keep-vlc-warm | cut -f1)
          test "$CURRENT" = "$GITHUB_SHA" || { echo 'Branch moved; refusing to overwrite another change.'; exit 1; }
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/reduce-memory-keep-vlc-warm
      - name: Require successful verification
        if: always()
        run: |
          test '${{ steps.install.outcome }}' = success
          test '${{ steps.typecheck.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
