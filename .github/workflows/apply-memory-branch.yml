name: Verify memory branch

on:
  push:
    branches: [codex/reduce-memory-keep-vlc-warm]
    paths: [.github/workflows/apply-memory-branch.yml]

permissions:
  contents: read

concurrency:
  group: memory-branch-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'mallenkb/LoomTV' && github.ref == 'refs/heads/codex/reduce-memory-keep-vlc-warm'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install typecheck and test dependencies without native install scripts
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Desktop typecheck
        run: corepack pnpm --filter loom-media-server-desktop typecheck
      - name: Memory, playback, and catalog projection regression tests
        working-directory: apps/desktop
        run: node --experimental-strip-types --test tests/boundedMemoryCache.test.ts tests/lazyNativeMemory.test.ts tests/nativePlaybackLifecycle.test.ts tests/libvlcSessionState.test.ts tests/videoPlayerHelpers.test.ts tests/libraryProjections.test.ts
      - name: Lint changed code
        working-directory: apps/desktop
        run: corepack pnpm exec eslint src/main/boundedMemoryCache.ts src/main/libvlcNativeTypes.ts src/main/memoryMetrics.ts src/main/libvlcWarmup.ts src/main/libvlcPlayback.ts src/main/libmpvPlayback.ts src/main.ts src/App.tsx src/contexts/LibraryContext.tsx src/components/VideoPlayer.tsx src/components/VideoPlayer/LazyVideoPlayer.tsx src/shared/desktopProtocol.ts tests/boundedMemoryCache.test.ts tests/lazyNativeMemory.test.ts tests/lazyNativeMemory.cases.cjs
      - name: Build desktop bundles
        run: corepack pnpm --filter loom-media-server-desktop build
      - name: Check diff whitespace and preserved runtime options
        run: |
          git diff --check 01e287f31a2f5b622feac07d3108b511c3e4a02c HEAD
          git diff --exit-code 01e287f31a2f5b622feac07d3108b511c3e4a02c HEAD -- apps/desktop/src/main/libvlcRuntimeConfig.ts apps/desktop/native/libmpv/bridge.m apps/desktop/src/main/windowManager.ts apps/desktop/src/components/VideoPlayer/usePlayerScrubbing.ts apps/desktop/src/components/VideoPlayer/engines/MpvPlaybackEngine.ts apps/desktop/src/components/VideoPlayer/engines/LibVlcPlaybackEngine.ts
