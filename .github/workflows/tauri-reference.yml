name: Capture Tauri port reference
on:
  push:
    branches: [codex/tauri-react-port]
    paths: ['.github/workflows/tauri-reference.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Archive tracked first-party source without runtime binaries or user data
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          extensions = {'.rs','.toml','.lock','.ts','.tsx','.js','.mjs','.cjs','.json','.sql','.md','.css','.html','.yaml','.yml'}
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open('evidence/first-party-source.tar.gz', 'w:gz') as archive:
              for name in filter(None, paths):
                  path = root / name
                  if any(part in path.parts for part in ('resources','node_modules','.pnpm-store','target','.git')):
                      continue
                  if path.is_symlink() or not path.is_file() or path.suffix not in extensions:
                      continue
                  archive.add(path, arcname=name, recursive=False)
          PY
          sha256sum evidence/first-party-source.tar.gz > evidence/source-archive.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tauri-full-reference-${{ github.sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
