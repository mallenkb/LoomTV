name: Mobile release gate

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'scripts/verify-mobile-release-boundaries.mjs'
      - '.github/workflows/mobile-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-boundaries:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run mobile source contracts
        run: pnpm --filter @loomtv/mobile test
      - name: Typecheck mobile source
        run: pnpm --filter @loomtv/mobile typecheck
      - name: Generate hardened native projects
        run: pnpm --filter @loomtv/mobile exec expo prebuild --clean --no-install
      - name: Verify regenerated release invariants
        run: node scripts/verify-mobile-release-boundaries.mjs
      - name: Compile unsigned Android release
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease
      - name: Install iOS pods
        working-directory: apps/mobile
        run: pod install --project-directory=ios
      - name: Compile iOS Release for Simulator
        working-directory: apps/mobile/ios
        run: xcodebuild -workspace LoomTVMobile.xcworkspace -scheme LoomTVMobile -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
