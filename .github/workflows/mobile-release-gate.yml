name: Mobile release gate

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'scripts/verify-mobile-release-boundaries.mjs'
      - '.github/workflows/mobile-release-gate.yml'
  workflow_dispatch:

jobs:
  release-boundaries:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run mobile source contracts
        run: pnpm --filter @loomtv/mobile test
      - name: Generate hardened native projects
        run: pnpm --filter @loomtv/mobile exec expo prebuild --clean --no-install
      - name: Verify regenerated release invariants
        run: node scripts/verify-mobile-release-boundaries.mjs
      - name: Compile unsigned Android release
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease
      - name: Compile iOS Release for Simulator
        working-directory: apps/mobile/ios
        run: xcodebuild -workspace LoomTV.xcworkspace -scheme LoomTV -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
