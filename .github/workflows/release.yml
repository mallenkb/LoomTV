name: Release

on:
  push:
    tags:
      - 'v*'
  # The manual-run UI must select an existing refs/tags/vMAJOR.MINOR.PATCH ref.
  # There is deliberately no free-form tag input to trust.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify protected release ref
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release-context.outputs.release_tag }}
      release_sha: ${{ steps.release-target.outputs.release_sha }}
      release_tag_oid: ${{ steps.release-target.outputs.release_tag_oid }}

    steps:
      - name: Derive and validate the actual release ref
        id: release-context
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_EVENT_AFTER: ${{ github.event.after }}
        shell: bash
        run: |
          RELEASE_TAG="$RELEASE_REF_NAME"
          if [[ "$RELEASE_REF_TYPE" != "tag" || "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Release workflow must run from an actual refs/tags/vMAJOR.MINOR.PATCH ref." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable vMAJOR.MINOR.PATCH release tags are required; prerelease tags are forbidden." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release event identity must provide a full github.sha commit." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release-context.outputs.release_tag }}

      - name: Verify immutable release tag target
        id: release-target
        env:
          RELEASE_EVENT_AFTER: ${{ github.event.after }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release-context.outputs.release_tag }}
        shell: bash
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "$RELEASE_TAG is not an existing tag." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "$RELEASE_TAG must be an annotated protected tag." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          tag_oid="$(git rev-parse "$tag_ref")"
          if [[ "$tag_commit" != "$RELEASE_EVENT_SHA" ]]; then
            echo "Release tag peeled commit does not match the event-time github.sha: expected $RELEASE_EVENT_SHA, found $tag_commit." >&2
            exit 1
          fi
          if [[ -n "$RELEASE_EVENT_AFTER" && "$RELEASE_EVENT_AFTER" != "0000000000000000000000000000000000000000" && "$RELEASE_EVENT_AFTER" != "$RELEASE_EVENT_SHA" && "$tag_oid" != "$RELEASE_EVENT_AFTER" ]]; then
            echo "Release tag object does not match the event-time ref object: expected $RELEASE_EVENT_AFTER, found $tag_oid." >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match exact tag $RELEASE_TAG." >&2
            exit 1
          fi
          echo "release_sha=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "release_tag_oid=$tag_oid" >> "$GITHUB_OUTPUT"

      - name: Verify deterministic tag, package, notes, and updater identity
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.release_tag }}
        run: node scripts/verify-release-identity.cjs "$RELEASE_TAG"

  make:
    name: Sign and package ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: production-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-26
            artifact: loomtv-macos
          - platform: Windows
            os: windows-latest
            artifact: loomtv-windows
          - platform: Linux
            os: ubuntu-latest
            artifact: loomtv-linux

    steps:
      - name: Check out verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Verify checked-out source identity
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build macOS installers
        id: build-macos
        if: runner.os == 'macOS'
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [[ -n "${MACOS_CSC_LINK:-}" ]]; then
            missing=()
            for name in MACOS_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              [[ -n "${!name:-}" ]] || missing+=("$name")
            done
            if (( ${#missing[@]} > 0 )); then
              printf 'Production macOS signing is partially configured; missing credential: %s\n' "${missing[@]}" >&2
              exit 1
            fi
            export CSC_LINK="$MACOS_CSC_LINK"
            export CSC_KEY_PASSWORD="$MACOS_CSC_KEY_PASSWORD"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No Developer ID certificate configured; the existing ad-hoc macOS signer will seal the app bundle.'
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi
          node apps/desktop/scripts/fetch-fpcalc.cjs
          node apps/desktop/scripts/run-release-dist.cjs

      - name: Build Windows installers
        id: build-windows
        if: runner.os == 'Windows'
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_SIGNER_THUMBPRINT: ${{ secrets.WINDOWS_SIGNER_THUMBPRINT }}
        shell: bash
        run: |
          if [[ -n "${WINDOWS_CSC_LINK:-}" ]]; then
            missing=()
            for name in WINDOWS_CSC_KEY_PASSWORD WINDOWS_SIGNER_THUMBPRINT; do
              [[ -n "${!name:-}" ]] || missing+=("$name")
            done
            if (( ${#missing[@]} > 0 )); then
              printf 'Production Windows signing is partially configured; missing credential: %s\n' "${missing[@]}" >&2
              exit 1
            fi
            export CSC_LINK="$WINDOWS_CSC_LINK"
            export CSC_KEY_PASSWORD="$WINDOWS_CSC_KEY_PASSWORD"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No Windows signing certificate configured; building an unsigned installer.'
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi
          node apps/desktop/scripts/fetch-fpcalc.cjs
          node apps/desktop/scripts/run-release-dist.cjs

      - name: Verify final macOS signature and notarization
        if: runner.os == 'macOS' && steps.build-macos.outputs.signed == 'true'
        env:
          MACOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: corepack pnpm --filter loom-media-server-desktop run verify:mac-release

      - name: Verify final Windows signatures
        if: runner.os == 'Windows' && steps.build-windows.outputs.signed == 'true'
        env:
          WINDOWS_SIGNER_THUMBPRINT: ${{ secrets.WINDOWS_SIGNER_THUMBPRINT }}
        shell: pwsh
        run: corepack pnpm --filter loom-media-server-desktop run verify:windows-release

      - name: Build Linux installers
        if: runner.os == 'Linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          node apps/desktop/scripts/fetch-fpcalc.cjs
          node apps/desktop/scripts/run-release-dist.cjs

      - name: Verify packaged runtime dependencies
        run: corepack pnpm --filter loom-media-server-desktop run verify:runtime

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}-${{ github.run_attempt }}
          path: |
            apps/desktop/out/builder/**/*.dmg
            apps/desktop/out/builder/**/*.zip
            apps/desktop/out/builder/**/*.exe
            !apps/desktop/out/builder/**/win-unpacked/**
            apps/desktop/out/builder/**/*.deb
            apps/desktop/out/builder/**/*.rpm
            apps/desktop/out/builder/**/*.AppImage
            apps/desktop/out/builder/**/*.blockmap
            apps/desktop/out/builder/**/*.yml
            apps/desktop/out/builder/**/*.yaml
            !apps/desktop/out/builder/**/app-update.yml
            !apps/desktop/out/builder/**/builder-debug.yml
          if-no-files-found: error

  attest-macos:
    name: Attest macOS artifacts with trusted builder
    needs:
      - prepare
      - make
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-attest-macos.yml
    with:
      artifact-name: loomtv-macos-${{ github.run_attempt }}

  attest-windows:
    name: Attest Windows artifacts with trusted builder
    needs:
      - prepare
      - make
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-attest-windows.yml
    with:
      artifact-name: loomtv-windows-${{ github.run_attempt }}

  attest-linux:
    name: Attest Linux artifacts with trusted builder
    needs:
      - prepare
      - make
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-attest-linux.yml
    with:
      artifact-name: loomtv-linux-${{ github.run_attempt }}

  publish-release:
    name: Publish GitHub release
    needs:
      - prepare
      - make
      - attest-macos
      - attest-windows
      - attest-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-release
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Check out verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Verify checked-out source identity
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Download macOS installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: loomtv-macos-${{ github.run_attempt }}
          path: release-assets

      - name: Download Windows installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: loomtv-windows-${{ github.run_attempt }}
          path: release-assets

      - name: Download Linux installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: loomtv-linux-${{ github.run_attempt }}
          path: release-assets

      - name: Initial re-verification of release tag type, object, and peeled commit
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TAG_OID: ${{ needs.prepare.outputs.release_tag_oid }}
        shell: bash
        run: |
          git fetch --no-tags --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "Release tag $RELEASE_TAG changed from an annotated tag." >&2
            exit 1
          fi
          current_tag_oid="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          if [[ "$current_tag_oid" != "$RELEASE_TAG_OID" ]]; then
            echo "Release tag $RELEASE_TAG object moved after prepare: expected $RELEASE_TAG_OID, found $current_tag_oid." >&2
            exit 1
          fi
          current_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "Release tag $RELEASE_TAG moved after prepare: expected $RELEASE_SHA, found $current_sha." >&2
            exit 1
          fi

      - name: Re-verify deterministic release identity
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: node scripts/verify-release-identity.cjs "$RELEASE_TAG"

      - name: Prepare release checksums and exact target manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG_OID: ${{ needs.prepare.outputs.release_tag_oid }}
        run: node scripts/release-evidence.cjs --assets release-assets --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --tag-oid "$RELEASE_TAG_OID"

      - name: Verify release evidence before publication
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG_OID: ${{ needs.prepare.outputs.release_tag_oid }}
        run: node scripts/release-evidence.cjs --verify --assets release-assets --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --tag-oid "$RELEASE_TAG_OID"

      - name: Inspect existing release state with explicit 404 handling
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          response_file="$(mktemp)"
          error_file="$(mktemp)"
          metadata_file="$RUNNER_TEMP/loomtv-prior-release.json"
          if gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >"$response_file" 2>"$error_file"; then
            status="$(awk '/^HTTP\/[0-9.]+ [0-9]+/{code=$2} END{print code}' "$response_file")"
            if [[ "$status" == "404" ]]; then
              echo 'existing_draft=false' >>"$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$status" != 2* ]]; then
              echo "GitHub API returned an unexpected success status while looking up $RELEASE_TAG: ${status:-unknown}." >&2
              cat "$error_file" >&2
              exit 1
            fi
            body_line="$(grep -n -m1 -E '^\{' "$response_file" | cut -d: -f1)"
            if [[ -z "$body_line" ]]; then
              echo "GitHub API returned no release JSON for $RELEASE_TAG." >&2
              exit 1
            fi
            tail -n "+$body_line" "$response_file" >"$metadata_file"
            if ! jq -e '.draft | type == "boolean"' "$metadata_file" >/dev/null; then
              echo "GitHub API release response for $RELEASE_TAG is missing a boolean draft state." >&2
              exit 1
            fi
            if [[ "$(jq -r '.draft' "$metadata_file")" != "true" ]]; then
              echo "Refusing to replace already-published release $RELEASE_TAG." >&2
              exit 1
            fi
            echo 'existing_draft=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          status="$(awk '/^HTTP\/[0-9.]+ [0-9]+/{code=$2} END{print code}' "$response_file")"
          if [[ "$status" == "404" ]]; then
            echo 'existing_draft=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "GitHub API release lookup failed for $RELEASE_TAG (HTTP ${status:-unknown}); only a confirmed 404 permits replacement." >&2
          cat "$error_file" >&2
          exit 1

      - name: Archive prior draft evidence before deletion
        if: steps.release-state.outputs.existing_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          archive_dir="$RUNNER_TEMP/loomtv-prior-draft-evidence-${GITHUB_RUN_ATTEMPT}"
          archive_path="$RUNNER_TEMP/loomtv-prior-draft-evidence-${GITHUB_RUN_ATTEMPT}.tar.gz"
          rm -rf "$archive_dir"
          mkdir -p "$archive_dir/assets"
          cp "$RUNNER_TEMP/loomtv-prior-release.json" "$archive_dir/release.json"
          asset_count="$(jq '.assets | length' "$archive_dir/release.json")"
          if (( asset_count > 0 )); then
            gh release download "$RELEASE_TAG" --dir "$archive_dir/assets" --pattern '*'
          else
            touch "$archive_dir/assets/NO_ASSETS_IN_PRIOR_DRAFT"
          fi
          tar -czf "$archive_path" -C "$archive_dir" .
          test -s "$archive_path"

      - name: Upload prior draft evidence archive before deletion
        if: steps.release-state.outputs.existing_draft == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: loomtv-prior-draft-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loomtv-prior-draft-evidence-${{ github.run_attempt }}.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Persist prior draft evidence as a permanent draft record
        if: steps.release-state.outputs.existing_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          archive_path="$RUNNER_TEMP/loomtv-prior-draft-evidence-${GITHUB_RUN_ATTEMPT}.tar.gz"
          evidence_record="loomtv-evidence-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes_file="$RUNNER_TEMP/loomtv-prior-draft-evidence-notes.txt"
          test -s "$archive_path"
          if gh release view "$evidence_record" >/dev/null 2>&1; then
            echo "Permanent evidence record already exists: $evidence_record" >&2
            exit 1
          fi
          printf 'Permanent prior-draft evidence for %s before replacement by workflow run %s attempt %s. This record must remain a draft and must not be deleted.\n' \
            "$RELEASE_TAG" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"$notes_file"
          gh release create "$evidence_record" \
            --draft \
            --target "$RELEASE_SHA" \
            --title "LoomTV release evidence: $RELEASE_TAG run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT" \
            --notes-file "$notes_file"
          gh release upload "$evidence_record" "$archive_path"
          archived_name="$(basename "$archive_path")"
          archived_size="$(gh release view "$evidence_record" --json assets --jq ".assets[] | select(.name == \"$archived_name\") | .size")"
          local_size="$(wc -c <"$archive_path" | tr -d ' ')"
          if [[ "$archived_size" != "$local_size" ]]; then
            echo "Permanent evidence record size mismatch: expected $local_size, found ${archived_size:-missing}." >&2
            exit 1
          fi
          echo "Archived prior draft evidence permanently as draft release $evidence_record."

      - name: Delete prior draft only after evidence archive succeeds
        if: steps.release-state.outputs.existing_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: gh release delete "$RELEASE_TAG" --yes

      - name: Revalidate tag type, object, and peeled commit immediately before draft creation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TAG_OID: ${{ needs.prepare.outputs.release_tag_oid }}
        shell: bash
        run: |
          git fetch --no-tags --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          [[ "$tag_type" == "tag" ]] || { echo "Release tag $RELEASE_TAG is no longer annotated." >&2; exit 1; }
          current_tag_oid="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          [[ "$current_tag_oid" == "$RELEASE_TAG_OID" ]] || { echo "Release tag object changed before draft creation: expected $RELEASE_TAG_OID, found $current_tag_oid." >&2; exit 1; }
          current_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$current_sha" == "$RELEASE_SHA" ]] || { echo "Release peeled commit changed before draft creation: expected $RELEASE_SHA, found $current_sha." >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          notes="docs/releases/v${version}.md"
          [[ -s "$notes" ]] || { echo "Deterministic release notes are missing: $notes" >&2; exit 1; }
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "LoomTV ${version}" \
            --notes-file "$notes"

      - name: Upload replacement draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if (( ${#assets[@]} == 0 )); then
            echo 'No release evidence files were prepared.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Verify complete draft asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          expected="$(find release-assets -type f -exec basename {} \; | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

      - name: Download and verify uploaded draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG_OID: ${{ needs.prepare.outputs.release_tag_oid }}
        shell: bash
        run: |
          remote_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$remote_dir" --pattern '*'
          node scripts/release-evidence.cjs --verify --assets "$remote_dir" --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --tag-oid "$RELEASE_TAG_OID"

      - name: Verify GitHub/SLSA subjects for every uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: node scripts/verify-release-attestations.cjs --assets release-assets --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"

      - name: Revalidate tag type, object, and peeled commit immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TAG_OID: ${{ needs.prepare.outputs.release_tag_oid }}
        shell: bash
        run: |
          git fetch --no-tags --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          [[ "$tag_type" == "tag" ]] || { echo "Release tag $RELEASE_TAG is no longer annotated." >&2; exit 1; }
          current_tag_oid="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          [[ "$current_tag_oid" == "$RELEASE_TAG_OID" ]] || { echo "Release tag object changed before publication: expected $RELEASE_TAG_OID, found $current_tag_oid." >&2; exit 1; }
          current_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$current_sha" == "$RELEASE_SHA" ]] || { echo "Release peeled commit changed before publication: expected $RELEASE_SHA, found $current_sha." >&2; exit 1; }
          draft_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          [[ "$draft_state" == "true" ]] || { echo "Release $RELEASE_TAG is not a draft at publication time." >&2; exit 1; }
          gh release edit "$RELEASE_TAG" --draft=false --latest
