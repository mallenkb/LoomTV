name: Apply libmpv default patch

on:
  push:
    branches:
      - codex/libmpv-default-memory-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/libmpv-default-memory-lifecycle
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          player_path = Path('apps/desktop/src/components/VideoPlayer.tsx')
          player = player_path.read_text()

          player = replace_once(
              player,
              """// LazyVideoPlayer imports this module while the library screen is idle. Warm
          // the native runtime then, not after the user clicks Play.
          void LibVlcPlaybackEngine.available().catch(() => false);
          void MpvPlaybackEngine.available().catch(() => false);""",
              """// LazyVideoPlayer imports this module while the library screen is idle. Resolve
          // the preferred libmpv runtime then, but keep LibVLC cold until IPTV or fallback.
          void MpvPlaybackEngine.available().catch(() => false);""",
              'idle runtime preload',
          )

          player = replace_once(
              player,
              """          ? [LibVlcPlaybackEngine, MpvPlaybackEngine]
                    : isIptvStream
                      ? [LibVlcPlaybackEngine]""",
              """          ? [MpvPlaybackEngine, LibVlcPlaybackEngine]
                    : isIptvStream
                      ? [LibVlcPlaybackEngine]""",
              'native engine preference',
          )

          player = replace_once(
              player,
              """  // Only engines reporting an in-window surface participate in native layout.
            // The MPV process currently uses an external window in both desktop apps.""",
              """  // Only engines reporting an in-window surface participate in native layout.
            // Both native backends can use the composited child surface.""",
              'native surface comment',
          )

          fallback_anchor = """      void (async () => {
                  if (failedEngineKind === 'libvlc' && await MpvPlaybackEngine.available().catch(() => false)) {"""
          fallback_replacement = """      void (async () => {
                  if (failedEngineKind === 'mpv' && await LibVlcPlaybackEngine.available().catch(() => false)) {
                    nativeAutoplayIssuedRef.current = false;
                    const fallbackEngine = new LibVlcPlaybackEngine(handleNativePlaybackState);
                    if (!playbackEngineRef.current && playerActiveRef.current) {
                      playbackEngineRef.current = fallbackEngine;
                      try {
                        const loaded = await fallbackEngine.load(filePath, {
                          startSeconds: fallbackPosition,
                          audioDelay: audioDelayRef.current,
                          subtitleDelay: 0,
                          subtitleFiles: visibleSubtitlesRef.current.flatMap((subtitle) => {
                            try {
                              const parsed = new URL(subtitle.url, 'http://127.0.0.1');
                              const subtitlePath = parsed.searchParams.get('path');
                              return subtitlePath ? [{ path: subtitlePath, source: subtitle.source || 'sidecar' as const }] : [];
                            } catch {
                              return [];
                            }
                          }),
                          nativeSubtitles: subtitlesDefaultEnabledRef.current,
                        });
                        if (loaded && playerActiveRef.current && playbackEngineRef.current === fallbackEngine) {
                          setNativePlaybackActive(true);
                          setNativeEngineKind('libvlc');
                          document.documentElement.classList.add('loom-native-active');
                          setStatusMessage('Opening with LibVLC...');
                          setErrorMessage(null);
                          return;
                        }
                      } catch (error) {
                        console.warn('[player] LibVLC fallback after libmpv failure could not start.', error);
                      }
                      if (playbackEngineRef.current === fallbackEngine) playbackEngineRef.current = null;
                      await fallbackEngine.destroy();
                    } else {
                      await fallbackEngine.destroy();
                    }
                  }
                  if (failedEngineKind === 'libvlc' && await MpvPlaybackEngine.available().catch(() => false)) {"""
          player = replace_once(player, fallback_anchor, fallback_replacement, 'runtime fallback')
          player_path.write_text(player)

          vlc_path = Path('apps/desktop/src/main/libvlcPlayback.ts')
          vlc = vlc_path.read_text()
          vlc = replace_once(
              vlc,
              """    // Git checkouts and macOS signing do not preserve the mtimes embedded in
              // VLC's plugins.dat. Let the one process-wide instance scan its plugins
              // once during LoomTV's startup splash instead of validating a stale cache
              // every time the user presses Play.""",
              """    // Git checkouts and macOS signing do not preserve the mtimes embedded in
              // VLC's plugins.dat. Session-owned instances scan on demand. Process-lifetime
              // warmup remains available only through LOOMTV_WARM_LIBVLC=1.""",
              'LibVLC instance comment',
          )
          vlc = replace_once(
              vlc,
              """    return `[playback] LibVLC default — ${candidate.source} runtime detected at ${candidate.path}; one process-lifetime instance is warmed at app startup`;
            }

            return '[playback] LibVLC default — no bundled or installed runtime file detected; compatibility playback will be used if startup warmup cannot create the native runtime';""",
              """    return `[playback] LibVLC fallback — ${candidate.source} runtime detected at ${candidate.path}; initializes on demand unless LOOMTV_WARM_LIBVLC=1`;
            }

            return '[playback] LibVLC fallback — no bundled or installed runtime file detected; libmpv or Chromium/HLS will handle compatible playback';""",
              'LibVLC runtime summary',
          )
          vlc_path.write_text(vlc)
          PY

          git diff --check
          git diff -- apps/desktop/src/components/VideoPlayer.tsx apps/desktop/src/main/libvlcPlayback.ts

      - name: Commit source edits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/components/VideoPlayer.tsx apps/desktop/src/main/libvlcPlayback.ts
          git diff --cached --quiet && exit 0
          git commit -m "Prefer libmpv for local playback"
          git push origin HEAD:codex/libmpv-default-memory-lifecycle
