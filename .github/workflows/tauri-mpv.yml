name: Verify Tauri external-player continuation
on:
  push:
    branches: [codex/tauri-react-port]
    paths: ['.github/tauri-mpv/**', '.github/workflows/tauri-mpv.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'mallenkb/LoomTV' && github.ref == 'refs/heads/codex/tauri-react-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Apply checksum-bound playback changes
        run: |
          python3 .github/tauri-mpv/apply.py
          cargo fmt --all
          git diff --check
      - name: Install test-only dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdbus-1-dev pkg-config ffmpeg mpv > /tmp/tauri-apt.log 2>&1
          mpv --no-config --version > evidence/mpv-version.txt
      - name: Run Rust unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p loomtv-core -p loomtv-playback --locked --no-fail-fast > evidence/unit-tests.log 2>&1 || { tail -140 evidence/unit-tests.log; exit 1; }
          tail -90 evidence/unit-tests.log
      - name: Test real mpv IPC lifecycle with generated media and null outputs
        env:
          LOOMTV_TEST_MPV: /usr/bin/mpv
          LOOMTV_TEST_FFMPEG: /usr/bin/ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p loomtv-playback --locked generated_mpv_ipc_play_seek_tracks_eof_and_cleanup -- --ignored --nocapture > evidence/mpv-test.log 2>&1 || { tail -140 evidence/mpv-test.log; exit 1; }
          cat evidence/mpv-test.log
      - name: Test actual scan and HLS delivery
        env:
          LOOMTV_TEST_FFMPEG: /usr/bin/ffmpeg
          LOOMTV_TEST_FFPROBE: /usr/bin/ffprobe
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p loomtv-core --locked generated_media_probe_hls_seek_range_and_revocation -- --ignored --nocapture > evidence/media.log 2>&1 || { tail -140 evidence/media.log; exit 1; }
      - name: Require strict Rust linting
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p loomtv-core -p loomtv-playback --all-targets --locked -- -D warnings > evidence/clippy.log 2>&1 || { tail -160 evidence/clippy.log; exit 1; }
      - name: Capture exact source and results
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          rustc --version --verbose > evidence/rustc.txt
          git diff --binary HEAD > evidence/verified.patch
          sha256sum evidence/verified.patch > evidence/verified.patch.sha256
          tar -czf evidence/port-source.tar.gz crates apps/desktop-tauri/src-tauri/src Cargo.toml Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tauri-mpv-services-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
  adapter:
    if: github.repository == 'mallenkb/LoomTV' && github.ref == 'refs/heads/codex/tauri-react-port'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Apply checksum-bound playback changes
        shell: bash
        run: |
          python3 .github/tauri-mpv/apply.py
          cargo fmt --all
          git diff --check
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf > /tmp/tauri-apt.log 2>&1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:workflow-policy
      - run: pnpm desktop:tauri:test
      - run: pnpm --filter @loom-media-server/desktop-tauri run typecheck
      - run: pnpm --filter loom-media-server-desktop run typecheck
      - run: pnpm --filter @loom-media-server/desktop-tauri run frontend:build
      - run: node apps/desktop-tauri/scripts/stage-runtimes.mjs
      - name: Compile the platform adapter
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose > evidence/rustc.txt
          cargo check -p loomtv-desktop-tauri --locked > evidence/adapter-check.log 2>&1 || { tail -160 evidence/adapter-check.log; exit 1; }
          tail -50 evidence/adapter-check.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tauri-mpv-adapter-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
  commit:
    needs: [verify, adapter]
    if: github.repository == 'mallenkb/LoomTV' && github.ref == 'refs/heads/codex/tauri-react-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production-release
      deployment: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: tauri-mpv-services-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence
      - name: Apply the verified desktop source diff
        run: |
          sha256sum -c evidence/verified.patch.sha256
          git apply --check evidence/verified.patch
          git apply --index evidence/verified.patch
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, paths):
              assert path.startswith(('crates/loomtv-core/', 'crates/loomtv-playback/', 'apps/desktop-tauri/src-tauri/src/')), path
          PY
          git diff --cached --check
      - name: Commit only to the requested branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(tauri): restore owned mpv fallback and scoped native lifecycle'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          remote="$(git ls-remote origin refs/heads/codex/tauri-react-port | cut -f1)"
          test "$remote" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/codex/tauri-react-port
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git rev-parse HEAD
