name: Build installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  make:
    name: Make ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-26
            artifact: loomtv-macos
          - platform: Windows
            os: windows-latest
            artifact: loomtv-windows
          - platform: Linux
            os: ubuntu-latest
            artifact: loomtv-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            npm run release
          else
            npm run dist
          fi

      - name: Verify packaged runtime dependencies
        run: npm run verify:runtime

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/builder/**/*.dmg
            out/builder/**/*.zip
            out/builder/**/*.exe
            out/builder/**/*.deb
            out/builder/**/*.rpm
            out/builder/**/*.AppImage
            out/builder/**/*.blockmap
            out/builder/**/*.yml
            out/builder/**/*.yaml
            out/builder/**/*.json
          if-no-files-found: error
