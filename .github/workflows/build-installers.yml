name: Build installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  make:
    name: Make ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-26
            artifact: loomtv-macos
          - platform: Windows
            os: windows-latest
            artifact: loomtv-windows
          - platform: Linux
            os: ubuntu-latest
            artifact: loomtv-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ -n "${MACOS_CSC_LINK:-}" ]]; then
              export CSC_LINK="$MACOS_CSC_LINK"
              export CSC_KEY_PASSWORD="${MACOS_CSC_KEY_PASSWORD:-}"
            else
              unset CSC_LINK CSC_KEY_PASSWORD
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ -n "${WINDOWS_CSC_LINK:-}" ]]; then
              export CSC_LINK="$WINDOWS_CSC_LINK"
              export CSC_KEY_PASSWORD="${WINDOWS_CSC_KEY_PASSWORD:-}"
            else
              unset CSC_LINK CSC_KEY_PASSWORD
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            corepack pnpm run release
          else
            corepack pnpm run dist
          fi

      - name: Verify packaged runtime dependencies
        run: corepack pnpm run verify:runtime

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/builder/**/*.dmg
            out/builder/**/*.zip
            out/builder/**/*.exe
            out/builder/**/*.deb
            out/builder/**/*.rpm
            out/builder/**/*.AppImage
            out/builder/**/*.blockmap
            out/builder/**/*.yml
            out/builder/**/*.yaml
            out/builder/**/*.json
          if-no-files-found: error
