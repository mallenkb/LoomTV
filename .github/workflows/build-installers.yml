name: Build installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  supply-chain:
    name: Audit dependencies and generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: corepack pnpm run audit:prod

      - name: Generate deterministic dependency SBOM
        run: corepack pnpm run sbom

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: loomtv-dependency-sbom
          path: artifacts/loomtv-sbom.cdx.json
          if-no-files-found: error

  mobile-android-config:
    name: Verify generated Android configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate tracked Android build policy
        run: corepack pnpm mobile:verify-android-config

      - name: Regenerate Android project from tracked Expo configuration
        run: corepack pnpm --filter @loom-media-server/mobile exec expo prebuild --clean --platform android --no-install

      - name: Validate generated Android project
        run: corepack pnpm mobile:verify-android-config -- --require-generated

  make:
    name: Make ${{ matrix.platform }}
    needs:
      - supply-chain
      - mobile-android-config
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-26
            artifact: loomtv-macos
          - platform: Windows
            os: windows-latest
            artifact: loomtv-windows
          - platform: Linux
            os: ubuntu-latest
            artifact: loomtv-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

      - name: Build installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          node apps/desktop/scripts/fetch-fpcalc.cjs

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ -n "${MACOS_CSC_LINK:-}" ]]; then
              export CSC_LINK="$MACOS_CSC_LINK"
              export CSC_KEY_PASSWORD="${MACOS_CSC_KEY_PASSWORD:-}"
            else
              unset CSC_LINK CSC_KEY_PASSWORD
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ -n "${WINDOWS_CSC_LINK:-}" ]]; then
              export CSC_LINK="$WINDOWS_CSC_LINK"
              export CSC_KEY_PASSWORD="${WINDOWS_CSC_KEY_PASSWORD:-}"
            else
              unset CSC_LINK CSC_KEY_PASSWORD
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          # Build without publishing here. A single release job below uploads
          # every platform's artifacts so parallel runners cannot race while
          # creating or updating the same GitHub release.
          corepack pnpm --filter loom-media-server-desktop run dist

      - name: Verify packaged runtime dependencies
        run: corepack pnpm --filter loom-media-server-desktop run verify:runtime

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/out/builder/**/*.dmg
            apps/desktop/out/builder/**/*.zip
            apps/desktop/out/builder/**/*.exe
            apps/desktop/out/builder/**/*.deb
            apps/desktop/out/builder/**/*.rpm
            apps/desktop/out/builder/**/*.AppImage
            apps/desktop/out/builder/**/*.blockmap
            apps/desktop/out/builder/**/*.yml
            apps/desktop/out/builder/**/*.yaml
            apps/desktop/out/builder/**/*.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: make
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download macOS installers
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7
        with:
          name: loomtv-macos
          path: release-assets

      - name: Download Windows installers
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7
        with:
          name: loomtv-windows
          path: release-assets

      - name: Download Linux installers
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7
        with:
          name: loomtv-linux
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/v${version}.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ -f "$notes" ]]; then
              gh release edit "$GITHUB_REF_NAME" \
                --title "LoomTV ${version}" \
                --notes-file "$notes"
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "LoomTV ${version}" \
              --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "LoomTV ${version}" \
              --generate-notes
          fi

          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
