[package]
name = "loomtv-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
rusqlite = { version = "0.34", features = ["bundled", "backup"] }
sha2 = "0.10"
ring = "0.17"
scrypt = "0.11"
base64 = "0.22"
subtle = "2"
regex = "1"
walkdir = "2"
jsonschema = { version = "0.33", default-features = false }
url = "2"
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
futures-util = "0.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }

mdns-sd = { version = "0.21.2", default-features = false, features = ["async"] }

flate2 = "1"
chrono = "0.4"
unicode-normalization = "0.1"
