name: loomtv

services:
  loomtv:
    # The checked-in deployment builds this release locally. Registry-based
    # deployments must replace it with a publisher-verified release or digest;
    # never use latest (see docs/nas-deployment.md).
    image: loomtv:1.0.111
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        LOOMTV_UID: ${PUID:-1000}
        LOOMTV_GID: ${PGID:-1000}
    container_name: loomtv
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${LOOMTV_PORT:-3847}:3847"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3847
      DATA_DIR: /config
      CACHE_DIR: /cache
      MEDIA_DIR: /media
      FFMPEG_PATH: /usr/bin/ffmpeg
      # Direct TLS is the default LAN path. Mount a certificate/key in /tls,
      # or explicitly configure the trusted reverse-proxy mode documented in
      # docs/nas-deployment.md. Cleartext 0.0.0.0 startup otherwise fails.
      # `-` (not `:-`) lets the reverse-proxy setup explicitly set these to
      # empty while retaining direct TLS as the default when they are unset.
      TLS_CERT_FILE: ${LOOMTV_TLS_CERT_FILE-/tls/fullchain.pem}
      TLS_KEY_FILE: ${LOOMTV_TLS_KEY_FILE-/tls/privkey.pem}
      REQUIRE_SECURE_TRANSPORT: ${LOOMTV_REQUIRE_SECURE_TRANSPORT:-false}
      TRUSTED_PROXIES: ${LOOMTV_TRUSTED_PROXIES:-}
      LOOMTV_DEVELOPMENT_ALLOW_INSECURE_NON_LOOPBACK: ${LOOMTV_DEVELOPMENT_ALLOW_INSECURE_NON_LOOPBACK:-false}
      # Set this only when the container has /dev/dri mounted.
      LOOMTV_VAAPI_DEVICE: ${LOOMTV_VAAPI_DEVICE:-}
      TZ: ${TZ:-UTC}
    volumes:
      - "${LOOMTV_CONFIG_DIR:-./data/config}:/config"
      - "${LOOMTV_CACHE_DIR:-./data/cache}:/cache"
      - "${LOOMTV_TLS_DIR:-./tls}:/tls:ro"
      # Keep media read-only.  Mount the host's SMB/NFS path here; LoomTV
      # should not receive NAS credentials or manage the network share.
      - "${LOOMTV_MEDIA_DIR:-./data/media}:/media:ro"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const h=require(process.env.TLS_CERT_FILE?'node:https':'node:http');const r=h.get({host:'127.0.0.1',port:process.env.PORT||3847,path:'/healthz',rejectUnauthorized:false},(x)=>process.exit(x.statusCode===200?0:1));r.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # Hardware transcoding is opt-in.  Uncomment only on a host configured
    # for the corresponding runtime; see docs/nas-deployment.md.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID:?set RENDER_GID for /dev/dri}"

    # NVIDIA Container Toolkit example (do not combine with the /dev/dri
    # example above unless the host explicitly needs both paths):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video]
