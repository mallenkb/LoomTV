packages:
  - apps/*
  - packages/*
  - .

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-static: true
  fs-xattr: true
  macos-alias: true
  msgpackr-extract: true
  unrs-resolver: true
blockExoticSubdeps: false
# 24 hour delay before pnpm accepts newly published package versions.
minimumReleaseAge: 1440
nodeLinker: hoisted
resolution-mode: highest
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.3
  vite-plus: 0.2.3
overrides:
  vite: 'catalog:'
  builder-util-runtime: 9.7.0
  '@expo/cli>tar': 7.5.21
  '@expo/cli>undici': 6.27.0
  '@expo/cli>ws': 8.21.0
  '@expo/metro-config>postcss': 8.5.18
  '@expo/xcpretty>js-yaml': 4.3.0
  brace-expansion: 5.0.8
  'electron-updater>js-yaml': 4.3.0
  'fast-uri@3.1.2': 3.1.4
  'react-devtools-core>shell-quote': 1.9.0
  'tar@7.5.15': 7.5.21
  'tar@7.5.16': 7.5.21
  'xcode>uuid': 11.1.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
resolutionMode: highest
patchedDependencies:
  brace-expansion@5.0.8: patches/brace-expansion@5.0.8.patch
  react-native-zeroconf@0.14.0: patches/react-native-zeroconf@0.14.0.patch
