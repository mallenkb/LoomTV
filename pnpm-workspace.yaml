packages:
  - apps/*
  - packages/*
  - .

allowBuilds:
  better-sqlite3: false
  bufferutil: false
  electron: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-static: false
  fs-xattr: true
  ip-set: false
  koffi: true
  macos-alias: true
  msgpackr-extract: true
  node-datachannel: true
  unrs-resolver: true
  utf-8-validate: false
  utp-native: false
blockExoticSubdeps: false
# 24 hour delay before pnpm accepts newly published package versions.
minimumReleaseAge: 1440
nodeLinker: hoisted
# Mac release jobs package both CPUs; retain optional native bindings for each.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - arm64
    - x64
catalog:
  '@loom-typescript/beta': npm:typescript@7.1.0-beta
  '@loom-typescript/stable': npm:typescript@7.0.2
  tsrs: 0.18.0-ts7.1.0-dev.20260929
  typescript: 6.0.3
  oxlint: 1.89.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  zod: 4.6.7
overrides:
  # Align Expo optional peers with its SDK 58 React compatibility set.
  react-dom: 19.3.0
  source-map-js: 1.2.2
  compression: 1.8.2
  vite: 'catalog:'
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
  browserslist: 4.28.8
  builder-util-runtime: 9.7.0
  '@expo/cli>tar': 7.5.21
  '@expo/cli>undici': 6.28.1
  '@expo/cli>ws': 8.21.0
  '@expo/metro-config>postcss': 8.5.23
  '@expo/xcpretty>js-yaml': 4.3.2
  '@istanbuljs/load-nyc-config>js-yaml': 4.3.2
  'electron-updater>js-yaml': 4.3.2
  '@xmldom/xmldom@0.8.13': 0.8.15
  '@xmldom/xmldom@0.9.10': 0.9.12
  'fast-uri@3.1.2': 3.1.8
  nanoid: 3.3.18
  'react-devtools-core>shell-quote': 1.11.0
  'tar@7.5.15': 7.5.21
  'tar@7.5.16': 7.5.21
  'xcode>uuid': 11.1.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
resolutionMode: highest
patchedDependencies:
  bittorrent-tracker@11.2.3: patches/bittorrent-tracker@11.2.3.patch
  braces@3.0.3: patches/braces@3.0.3.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  react-native-zeroconf@0.17.6: patches/react-native-zeroconf@0.17.6.patch
